version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: attendance_test
      POSTGRES_USER: postgres
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test_network

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:test_password@db:5432/attendance_test
      TIME_CARD_PASSWORD: ${TIME_CARD_PASSWORD:-test_password}
      COVERAGE: ${COVERAGE:-false}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - bundle_cache:/usr/local/bundle
      - .:/rails
      - test_results:/rails/tmp/test_results
      - playwright_cache:/ms-playwright
    working_dir: /rails
    networks:
      - test_network
    command: bundle exec rspec

volumes:
  postgres_test_data:
  test_results:
  bundle_cache:
  playwright_cache:

networks:
  test_network:
    driver: bridge
